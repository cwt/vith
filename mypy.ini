[mypy]
# Match the packaging floor (pyproject.toml requires-python = '>=3.10'); this keeps
# 3.11+ only syntax out of the type-checked baseline, per the documented
# 3.10 compatibility verification.
python_version = 3.10

# prompt_toolkit, pygments, six, jedi, pyflakes, docopt, ... have no
# type stubs / py.typed marker: don't drown the real errors in noise.
ignore_missing_imports = True
exclude = (?x)( ^build/ | ^dist/ )
