# Tool configuration and PEP 621 packaging for vith.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vith"
version = "0.12.1"
description = "Vith — a pure-Python Vi clone with Thai & Lao script support (fork of pyvim)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Chaiwat Suttipongsakul", email = "cwt@bashell.com" },
]
maintainers = [
    { name = "Chaiwat Suttipongsakul", email = "cwt@bashell.com" },
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "prompt_toolkit>=3.0.0,<3.1.0",
    "pyflakes",
    "pygments",
    "docopt",
    "quez>=1.1.3",
    # Python 3.14+ has zstd in the standard library; older versions need
    # the zstandard package to keep zstd as the default cold-text backend.
    "zstandard; python_version < '3.14'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Text Editors",
    "Topic :: Text Editors :: Text Processing",
]
[project.urls]
Homepage = "https://github.com/cwt/vith"
Repository = "https://github.com/cwt/vith.git"
Upstream = "https://github.com/prompt-toolkit/pyvim"

[project.optional-dependencies]
jedi = [
    "jedi",
]
lzo = [
    "python-lzo",
]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[project.scripts]
vith = "vith.entry_points.run_vith:run"

[tool.setuptools.packages.find]
include = ["vith*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    # `ruff format` keeps long string literals intact; do not fail lint on them.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["vith"]

[tool.ruff.format]
# Keep the existing mix of single/double quotes instead of rewriting every
# string in one sweep.
quote-style = "preserve"
